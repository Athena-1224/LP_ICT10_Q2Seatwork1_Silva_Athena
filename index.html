<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <!--for design-->

    <title>Q2 Seatwork #1</title>
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            margin: 250px; 
            font-size: 18px;
        }
        input[type="text"] {
            border: 1px solid rgb(151, 57, 120);
            width: 50%;
            padding: 10px;
            border-radius: 20px;
            font-size: 15px;
            background-color: white;
        }
        input[type="button"] {
            background-color: rgb(151, 57, 120);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
        }
        input[type="button"]:hover {
            background-color: rgb(151, 34, 102);
        }
    </style>
</head>
<body style="background-image: url('https://i.pinimg.com/736x/e9/59/44/e95944e787599caa1f1937b7b84888f6.jpg'); background-size: cover;">

    <div class="container mt-5" style="background-color: #e0b9e7; padding: 30px; border-radius: 20px; opacity: 85%; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);"> 
    <header>
        <div class="reactor"></div>
        <h1 style="background-color: #d48be2; border-radius: 30px;">💿🎙️~ Grade 10 Glee Club Checker ~🎙️💿</h1>
        <h2 style="color: rgb(151, 57, 120);">Candidate Verification System</h2>
    </header>

    <main>
        <form>
            <label style="font-weight: bold;">First Name:</label><br>
            <input type="text" id="first_name" placeholder="Enter your first name"><br>
            <br>
            <label style="font-weight: bold;">Last Name:</label><br>
            <input type="text" id="last_name" placeholder="Enter your last name"><br><br>
            <input type="button" py-click="candidate_checker" value="Enter"><br><br>
            <!--py-click is where you look for it (?)-->
        </form>
        <div id="result" style="color: #431f4b; font-size: 20px; font-weight: bold;"></div>
    </main>
    <footer>
        &copy; 2026 <span>Glee Club 2026</span> &bull; Seatwork #1 &bull; 2nd Quarter
        <!--&bull; is just "and" (?)-->
    </footer>

    <py-script src = "main.py"></py-script>
    </div>
</body>
</html>
